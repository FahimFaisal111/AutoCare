# ============================================================================
# AutoCare AI - Backend Configuration (Spring Boot 3.x)
# ============================================================================

spring.application.name=autocare-backend
server.port=8080

# ----------------------------------------------------------------------------
# 1. MySQL DataSource Configuration (HikariCP Connection Pool)
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autocare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ----------------------------------------------------------------------------
# 2. JPA & Hibernate ORM Configuration
# ----------------------------------------------------------------------------
# 'validate': Checks entity mappings against MySQL DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# 3. Stateless JWT Security Configuration
# ----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
